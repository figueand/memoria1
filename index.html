<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Juegos Interactivos</title>
  <style>
    /* Reset básico */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden; /* Elimina cualquier scroll */
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f0f4f8;
      color: #333;
    }

    /* Pantalla principal del juego: ocupa el 100% exacto de la vista */
    .game-screen {
      width: 100vw;
      height: 100dvh; /* Dynamic Viewport Height para adaptarse a barras móviles */
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      overflow: hidden;
    }

    /* Cabecera adaptativa */
    .header {
      width: 100%;
      max-width: 800px;
      text-align: center;
      flex-shrink: 0;
    }

    .title {
      font-size: clamp(1.2rem, 4vw, 2.2rem);
      color: #2c3e50;
      font-weight: 700;
    }

    .subtitle {
      font-size: clamp(0.8rem, 2.5vw, 1.1rem);
      color: #7f8c8d;
      margin-top: 4px;
    }

    /* Zona central interactiva (se escala automáticamente) */
    .main-board {
      flex: 1;
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0.5rem 0;
      min-height: 0; /* Necesario para que flexbox respete el alto disponible */
    }

    /* Tablero en rejilla adaptable */
    .grid-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      height: 100%;
      max-height: 100%;
      aspect-ratio: 1 / 1; /* Mantiene la proporción cuadrada */
    }

    /* Tarjetas/Fichas del juego */
    .card {
      background: white;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: clamp(1.5rem, 6vw, 3rem);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      border: 2px solid #e2e8f0;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.2s ease;
    }

    .card:active {
      transform: scale(0.95);
    }

    .card.selected {
      background-color: #3b82f6;
      color: white;
      border-color: #2563eb;
    }

    /* Pie de página con controles */
    .footer {
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .btn {
      flex: 1;
      padding: clamp(0.6rem, 2vh, 1rem);
      font-size: clamp(0.9rem, 2.5vw, 1.1rem);
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background-color: #10b981;
      color: white;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.1);
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: #059669;
    }

    .btn-secondary {
      background-color: #64748b;
    }

    .btn-secondary:hover {
      background-color: #475569;
    }
  </style>
</head>
<body>

  <main class="game-screen">
    <!-- Cabecera -->
    <header class="header">
      <h1 class="title" id="game-title">Juego Interactivo</h1>
      <p class="subtitle" id="game-desc">Toca una casilla para jugar</p>
    </header>

    <!-- Área principal (sin scroll) -->
    <section class="main-board">
      <div class="grid-board" id="board">
        <div class="card" onclick="playCard(this)">⚽</div>
        <div class="card" onclick="playCard(this)">🏀</div>
        <div class="card" onclick="playCard(this)">🎾</div>
        <div class="card" onclick="playCard(this)">🏐</div>
        <div class="card" onclick="playCard(this)">🏉</div>
        <div class="card" onclick="playCard(this)">🏓</div>
        <div class="card" onclick="playCard(this)">🏸</div>
        <div class="card" onclick="playCard(this)">🥊</div>
        <div class="card" onclick="playCard(this)">🎯</div>
      </div>
    </section>

    <!-- Controles -->
    <footer class="footer">
      <button class="btn btn-secondary" onclick="resetGame()">Reiniciar</button>
      <button class="btn" onclick="nextLevel()">Siguiente</button>
    </footer>
  </main>

  <script>
    function playCard(element) {
      element.classList.toggle('selected');
    }

    function resetGame() {
      const cards = document.querySelectorAll('.card');
      cards.forEach(card => card.classList.remove('selected'));
    }

    function nextLevel() {
      alert('¡Siguiente nivel cargado!');
      resetGame();
    }
  </script>

</body>
</html>
